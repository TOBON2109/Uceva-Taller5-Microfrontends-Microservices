<section class="container">
  <h2>Pedidos</h2>
  <form class="toolbar" (ngSubmit)="load()">
    <label for="count">Cantidad</label>
    <input id="count" name="count" type="number" min="1" max="100" [(ngModel)]="count" />
    <button type="submit">Cargar</button>
  </form>

  @if (loading()) {
    <p>Cargando...</p>
  } @else if (error()) {
    <p class="alert">{{ error() }}</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.customer }}</td>
            <td>{{ item.product }}</td>
            <td>{{ item.quantity }}</td>
            <td>{{ item.total }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5">Sin datos</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
