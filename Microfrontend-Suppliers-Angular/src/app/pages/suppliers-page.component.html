<section class="container">
  <h2>Proveedores</h2>
  <form class="toolbar" (ngSubmit)="load()">
    <label for="count">Cantidad</label>
    <input id="count" name="count" type="number" min="1" max="100" [(ngModel)]="count" />
    <button type="submit">Cargar</button>
  </form>

  @if (loading()) {
    <p>Cargando...</p>
  } @else if (error()) {
    <p class="alert">{{ error() }}</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Empresa</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Ciudad</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.company }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.phone }}</td>
            <td>{{ item.city }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5">Sin datos</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
